[package]
name = "react_compiler_swc"
version = "0.1.0"
edition = "2024"

# Vendored fork of react_compiler_swc, retargeted to swc_core (v23 AST) so
# turbopack can call transform() directly without a text round-trip.
# The core compiler logic (react_compiler, react_compiler_ast) stays on git.

[dependencies]
react_compiler_ast = { git = "https://github.com/facebook/react.git", rev = "55d6ff61692a99b47818dcf25e82350d39a26235", package = "react_compiler_ast" }
react_compiler = { git = "https://github.com/facebook/react.git", rev = "55d6ff61692a99b47818dcf25e82350d39a26235", package = "react_compiler" }
react_compiler_diagnostics = { git = "https://github.com/facebook/react.git", rev = "55d6ff61692a99b47818dcf25e82350d39a26235", package = "react_compiler_diagnostics" }
react_compiler_hir = { git = "https://github.com/facebook/react.git", rev = "55d6ff61692a99b47818dcf25e82350d39a26235", package = "react_compiler_hir" }
swc_core = { workspace = true, features = ["ecma_ast", "ecma_visit", "ecma_parser", "common"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
